spring.application.name=demo4
server.port=${PORT:8080}

# Cấu hình kết nối MySQL hỗ trợ biến môi trường linh hoạt
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finance_managent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Thodz1234@}

# Khóa bí mật ký JWT Token (có thể ghi đè bằng biến môi trường JWT_SECRET khi deploy)
jwt.secret=${JWT_SECRET:DayLaChuoiBiMatSieuCapVipProDungDeKyTokenChoDuAnNhanhNhat2026CuaToi}

# Cấu hình Hibernate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false

# OCR Microservice Configuration
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8001}
file.upload-dir=${FILE_UPLOAD_DIR:uploads/receipts}

# File and payload limits
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Cấu hình Spring Mail gửi mã OTP (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true